<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" version="1.1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Can body -->
  <path d="M 60,25 L 140,25 C 145,25 150,30 150,35 L 150,165 C 150,170 145,175 140,175 L 60,175 C 55,175 50,170 50,165 L 50,35 C 50,30 55,25 60,25 Z" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
  
  <!-- Can top -->
  <ellipse cx="100" cy="25" rx="42" ry="10" fill="#2a2a2a" stroke="#000" stroke-width="2"/>
  <ellipse cx="100" cy="23" rx="40" ry="8" fill="#3a3a3a"/>
  
  <!-- Can rim detail -->
  <rect x="70" y="15" width="60" height="4" rx="2" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
  
  <!-- SW wave design (main graphic) -->
  <g transform="translate(100, 90)">
    <!-- White wave -->
    <path d="M -25,-35 Q -15,-50 -5,-45 Q 5,-35 15,-40 Q 25,-45 35,-30 L 35,50 L -35,50 Z" fill="#ffffff"/>
    
    <!-- SW text -->
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SW</text>
  </g>
  
  <!-- Can bottom -->
  <ellipse cx="100" cy="175" rx="42" ry="10" fill="#0a0a0a" stroke="#000" stroke-width="2"/>
  
  <!-- Shine/highlight effect -->
  <rect x="58" y="30" width="6" height="135" fill="#ffffff" opacity="0.2" rx="3"/>
</svg>